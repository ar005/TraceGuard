                content:  { type: string }
      responses:
        "201": { description: Created }

  /deception/lures/{id}/download:
    get:
      tags: [Deception]
      summary: Download a lure file
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Lure file content }

  /deception/lures/{id}:
    delete:
      tags: [Deception]
      summary: Delete a lure (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  # ─── CANARY ────────────────────────────────────────────────────────────────

  /canary/tokens:
    get:
      tags: [Canary]
      summary: List canary tokens
      responses:
        "200": { description: Token list }
    post:
      tags: [Canary]
      summary: Create a canary token (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                description: { type: string }
                alert_on_trigger: { type: boolean, default: true }
      responses:
        "201": { description: Created token with trigger URL }

  /canary/tokens/{id}:
    delete:
      tags: [Canary]
      summary: Delete a canary token (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  # ─── COMPLIANCE ────────────────────────────────────────────────────────────

  /compliance/coverage:
    get:
      tags: [Compliance]
      summary: MITRE ATT&CK coverage by enabled detection rules
      responses:
        "200":
          description: Coverage map
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_techniques:   { type: integer }
                  covered_techniques: { type: integer }
                  coverage_pct:       { type: number }
                  techniques:         { type: object, additionalProperties: { type: array, items: { type: string } } }

  # ─── REPORTS ───────────────────────────────────────────────────────────────

  /reports:
    get:
      tags: [Reports]
      summary: List generated reports
      responses:
        "200": { description: Report list }
    post:
      tags: [Reports]
      summary: Generate a new report
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [report_type]
              properties:
                report_type: { type: string, enum: [executive_summary, incident_detail, compliance, threat_intel] }
                from:        { type: string, format: date-time }
                to:          { type: string, format: date-time }
                incident_id: { type: string, nullable: true }
      responses:
        "202": { description: Report generation started }

  /reports/{id}/download:
    get:
      tags: [Reports]
      summary: Download a generated report (PDF or JSON)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [pdf, json], default: pdf } }
      responses:
        "200": { description: Report file }
        "404": { description: Not found or not ready }

  # ─── DISRUPTION ────────────────────────────────────────────────────────────

  /disruption/policies:
    get:
      tags: [Disruption]
      summary: List autonomous disruption policies
      responses:
        "200": { description: Policy list }
    post:
      tags: [Disruption]
      summary: Create a disruption policy (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, trigger_severity, action]
              properties:
                name:             { type: string }
                trigger_severity: { type: integer }
                action:           { type: string, enum: [isolate, block_ip, kill_process] }
                enabled:          { type: boolean }
      responses:
        "201": { description: Created }

  /disruption/policies/{id}:
    put:
      tags: [Disruption]
      summary: Update a disruption policy (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Disruption]
      summary: Delete a disruption policy (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /disruption/containments:
    get:
      tags: [Disruption]
      summary: List currently active containments
      responses:
        "200": { description: Active containments }

  /disruption/containments/{id}/release:
    post:
      tags: [Disruption]
      summary: Release an active containment (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Released }

  # ─── REMEDIATION ───────────────────────────────────────────────────────────

  /remediation/rules:
    get:
      tags: [Remediation]
      summary: List auto-remediation rules
      responses:
        "200": { description: Rule list }

  /remediation/rules/{id}:
    put:
      tags: [Remediation]
      summary: Create or update a remediation rule (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Saved }
    delete:
      tags: [Remediation]
      summary: Delete a remediation rule (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  # ─── AUTO CASE ─────────────────────────────────────────────────────────────

  /autocase/policies:
    get:
      tags: [AutoCase]
      summary: List automatic case-creation policies
      responses:
        "200": { description: Policy list }

  /autocase/policies/{id}:
    put:
      tags: [AutoCase]
      summary: Create or update an auto-case policy (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Saved }

  # ─── TIP ───────────────────────────────────────────────────────────────────

  /tip/settings:
    get:
      tags: [TIP]
      summary: Get MISP/TIP sync settings
      responses:
        "200": { description: TIP settings }
    put:
      tags: [TIP]
      summary: Update TIP sync settings (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:      { type: string, format: uri }
                api_key:  { type: string }
                enabled:  { type: boolean }
                interval_h: { type: integer }
      responses:
        "200": { description: Updated }

  /tip/pull:
    post:
      tags: [TIP]
      summary: Manually pull IOCs from TIP/MISP (admin)
      responses:
        "200":
          description: Pull result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }

  /tip/push:
    post:
      tags: [TIP]
      summary: Push matched IOCs back to MISP (admin)
      responses:
        "200":
          description: Push result
          content:
            application/json:
              schema:
                type: object
                properties:
                  pushed: { type: integer }

  /tip/status:
    get:
      tags: [TIP]
      summary: TIP sync status and last run timestamps
      responses:
        "200": { description: TIP status }

  # ─── SOURCES ───────────────────────────────────────────────────────────────

  /sources:
    get:
      tags: [Sources]
      summary: List XDR connector sources
      responses:
        "200": { description: Source list }

  /sources/{id}:
    get:
      tags: [Sources]
      summary: Get a source
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Source }

  /sources/{id}/health:
    get:
      tags: [Sources]
      summary: Health and connectivity status for a source
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Health status }

  # ─── AGENT GROUPS ──────────────────────────────────────────────────────────

  /agent-groups:
    get:
      tags: [Agent Groups]
      summary: List agent groups
      responses:
        "200": { description: Group list }
    post:
      tags: [Agent Groups]
      summary: Create an agent group (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                description: { type: string }
      responses:
        "201": { description: Created }

  /agent-groups/{id}:
    get:
      tags: [Agent Groups]
      summary: Get an agent group
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Group }
    put:
      tags: [Agent Groups]
      summary: Update an agent group (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Agent Groups]
      summary: Delete an agent group (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /agent-groups/{id}/members:
    get:
      tags: [Agent Groups]
      summary: List agents in a group
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Agent list }

  /agent-groups/{id}/fleet-config:
    post:
      tags: [Agent Groups]
      summary: Push fleet config to all agents in a group (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Fleet config to push
      responses:
        "200": { description: Pushed }

  # ─── TASKS ─────────────────────────────────────────────────────────────────

  /tasks:
    get:
      tags: [Tasks]
      summary: List all scheduled agent tasks
      responses:
        "200": { description: Task list }

  /tasks/history:
    get:
      tags: [Tasks]
      summary: List task execution history across all agents
      responses:
        "200": { description: History }

  /agents/{id}/tasks:
    get:
      tags: [Tasks]
      summary: List tasks for a specific agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Tasks }
    post:
      tags: [Tasks]
      summary: Create a task for an agent (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, action]
              properties:
                name:     { type: string }
                action:   { type: string }
                args:     { type: array, items: { type: string } }
                cron:     { type: string, description: "Cron expression for scheduled tasks" }
                enabled:  { type: boolean }
      responses:
        "201": { description: Created }

  /agents/{id}/tasks/history:
    get:
      tags: [Tasks]
      summary: Task execution history for a specific agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: History }

  /agents/{id}/tasks/{tid}:
    put:
      tags: [Tasks]
      summary: Update a task (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Tasks]
      summary: Delete a task (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /agents/{id}/tasks/{tid}/run:
    post:
      tags: [Tasks]
      summary: Run a task immediately (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: tid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Run triggered }

  # ─── CHAINS ────────────────────────────────────────────────────────────────

  /chains:
    get:
      tags: [Chains]
      summary: List attack chains
      responses:
        "200": { description: Chain list }

  /chains/{id}:
    get:
      tags: [Chains]
      summary: Get an attack chain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Chain }

  /chains/{id}/events:
    get:
      tags: [Chains]
      summary: Events in an attack chain
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Events }

  # ─── SETTINGS ──────────────────────────────────────────────────────────────

  /settings/retention:
    get:
      tags: [Admin]
      summary: Get data retention settings
      responses:
        "200": { description: Retention config }
    post:
      tags: [Admin]
      summary: Update retention settings (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                events_days:  { type: integer }
                alerts_days:  { type: integer }
                breaches_days: { type: integer }
      responses:
        "200": { description: Updated }

  /settings/llm:
    get:
      tags: [Admin]
      summary: Get LLM provider settings (admin)
      responses:
        "200": { description: LLM settings }
    post:
      tags: [Admin]
      summary: Update LLM settings (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:  { type: string, enum: [anthropic, openai, gemini, ollama] }
                api_key:   { type: string }
                model:     { type: string }
                base_url:  { type: string, description: "For Ollama/self-hosted" }
      responses:
        "200": { description: Updated }

  /settings/llm/test:
    post:
      tags: [Admin]
      summary: Test LLM connectivity (admin)
      responses:
        "200": { description: Test result }

  /settings/enrichment:
    get:
      tags: [Admin]
      summary: Get enrichment API settings
      responses:
        "200": { description: Enrichment settings }
    post:
      tags: [Admin]
      summary: Update enrichment settings (VirusTotal key, etc.) (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                virustotal_key: { type: string }
                shodan_key:     { type: string }
                enabled:        { type: boolean }
      responses:
        "200": { description: Updated }

  # ─── ADMIN — USERS & API KEYS ──────────────────────────────────────────────

  /apikeys:
    get:
      tags: [Admin]
      summary: List API keys for the current user
      responses:
        "200": { description: Key list }
    post:
      tags: [Admin]
      summary: Create an API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "201":
          description: Created key (secret shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string }
                  name:   { type: string }
                  key:    { type: string, description: "Full API key — shown once" }
                  expires_at: { type: string, format: date-time, nullable: true }

  /apikeys/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke an API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Revoked }

  /apikeys/{id}:
    delete:
      tags: [Admin]
      summary: Delete an API key
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /migrate/export:
    post:
      tags: [Admin]
      summary: Export tenant data for migration (admin)
      responses:
        "200": { description: Export bundle }

  /migrate/import:
    post:
      tags: [Admin]
      summary: Import tenant data from migration bundle (admin)
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200": { description: Import result }
