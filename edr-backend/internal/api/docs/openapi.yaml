  # ─── LIVE RESPONSE ─────────────────────────────────────────────────────────

  /liveresponse/agents:
    get:
      tags: [Live Response]
      summary: List agents with active live-response sessions
      responses:
        "200": { description: Active session list }

  /liveresponse/command:
    post:
      tags: [Live Response]
      summary: Send a command to an agent live-response session (admin)
      description: |
        Allowed actions: `shell`, `isolate`, `release`, `block_ip`, `unblock_ip`, `kill_process`, `memdump`.
        Blocked: `rm -rf`, `mkfs`, `dd if=`, `shutdown`, `reboot`.
        Output capped at 1 MB stdout / 64 KB stderr.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, action]
              properties:
                agent_id: { type: string, format: uuid }
                action:   { type: string }
                args:     { type: array, items: { type: string } }
      responses:
        "200":
          description: Command result
          content:
            application/json:
              schema:
                type: object
                properties:
                  stdout:    { type: string }
                  stderr:    { type: string }
                  exit_code: { type: integer }

  /pending-commands:
    post:
      tags: [Live Response]
      summary: Enqueue a command for delivery on next agent heartbeat (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, action]
              properties:
                agent_id: { type: string }
                action:   { type: string }
                args:     { type: array, items: { type: string } }
      responses:
        "201": { description: Enqueued }

  /pending-commands/{agent_id}:
    get:
      tags: [Live Response]
      summary: List pending commands for an agent (admin)
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Pending commands }

  /pending-commands/{id}:
    delete:
      tags: [Live Response]
      summary: Cancel a pending command (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cancelled }

