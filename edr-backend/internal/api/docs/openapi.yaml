openapi: "3.0.3"
info:
  title: TraceGuard EDR API
  version: "1.0"
  description: |
    REST API for TraceGuard — a self-hosted Linux/Windows XDR platform.

    **Authentication**: All endpoints (except `/auth/login`, `/health`, `/metrics/prometheus`, `/api/canary/trigger/:token`) require a Bearer token:
    - **JWT**: obtained from `POST /api/v1/auth/login`
    - **API Key**: created via `POST /api/v1/apikeys`

    Pass as `Authorization: Bearer <token>`.

    **Roles**: Endpoints marked **(admin)** require the `admin` role. Analyst-role tokens can read most resources but cannot create/modify detection rules, suppressions, user accounts, or system settings.

    **Rate limiting**: Default 20 req/s burst 40 per IP. Hunt and inject endpoints are stricter.

    **Multi-tenancy**: The `tenant_id` is derived from the authenticated token. Pass `?tenant=<id>` (admin only) to query a specific tenant.
  contact:
    name: TraceGuard
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentication and session management
  - name: Agents
    description: Endpoint agent inventory and management
  - name: Events
    description: Raw telemetry events from agents
  - name: Alerts
    description: Detection alerts and AI triage
  - name: Incidents
    description: Correlated incident groups
  - name: Cases
    description: Investigation case management
  - name: Rules
    description: Detection rules (match, threshold, sequence)
  - name: YARA
    description: YARA rule management
  - name: Suppressions
    description: Alert suppression filters
  - name: IOCs
    description: Indicators of Compromise
  - name: IOC Feeds
    description: Custom IOC feed sources
  - name: Hunt
    description: Threat hunting queries
  - name: SLA
    description: SLA policies and breach tracking
  - name: Playbooks
    description: SOAR playbooks and response actions
  - name: Live Response
    description: Remote agent command execution
  - name: Metrics
    description: SOC performance metrics and DB stats
  - name: Vulnerabilities
    description: Package inventory and CVE matching
  - name: Identity
    description: User identity, sessions, and UEBA
  - name: Intel
    description: Threat intelligence — actors, campaigns, TAXII, replay
  - name: Forensics
    description: Remote memory/artifact acquisition
  - name: Containers
    description: Container inventory
  - name: Assets
    description: Asset inventory (XDR sources)
  - name: XDR
    description: Cross-source threat scoring and lateral graph
  - name: DNS
    description: DNS intelligence
  - name: DLP
    description: Data loss prevention signals
  - name: Deception
    description: Honeypots and lure files
  - name: Canary
    description: Canary tokens
  - name: Compliance
    description: MITRE ATT&CK coverage
  - name: Reports
    description: Generated reports
  - name: Disruption
    description: Autonomous containment policies
  - name: Remediation
    description: Auto-remediation rules
  - name: AutoCase
    description: Automatic case-creation policies
  - name: TIP
    description: Threat Intelligence Platform (MISP) sync
  - name: Sources
    description: XDR connector sources
  - name: Agent Groups
    description: Agent group management and fleet config
  - name: Tasks
    description: Scheduled agent tasks
  - name: Chains
    description: Attack chain / kill-chain tracking
  - name: Admin
    description: User management, API keys, settings, audit

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: "record not found"

    Agent:
      type: object
      properties:
        id:           { type: string, format: uuid }
        hostname:     { type: string }
        os:           { type: string, example: linux }
        arch:         { type: string, example: amd64 }
        agent_ver:    { type: string }
        ip:           { type: string }
        status:       { type: string, enum: [online, offline, isolated] }
        risk_score:   { type: number, format: float }
        last_seen:    { type: string, format: date-time }
        tenant_id:    { type: string }

    Event:
      type: object
      properties:
        id:           { type: string, format: uuid }
        agent_id:     { type: string, format: uuid }
        hostname:     { type: string }
        event_type:   { type: string, example: PROCESS_START }
        timestamp:    { type: string, format: date-time }
        payload:      { type: object, description: "Event-type-specific fields" }
        chain_id:     { type: string }
        tenant_id:    { type: string }

    Alert:
      type: object
      properties:
        id:              { type: string, format: uuid }
        rule_id:         { type: string, format: uuid }
        rule_name:       { type: string }
        agent_id:        { type: string, format: uuid }
        hostname:        { type: string }
        severity:        { type: integer, minimum: 1, maximum: 5 }
        status:          { type: string, enum: [open, acknowledged, resolved, false_positive] }
        mitre_ids:       { type: array, items: { type: string } }
        first_seen:      { type: string, format: date-time }
        last_seen:       { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at:     { type: string, format: date-time, nullable: true }
        triage_verdict:  { type: string, nullable: true }
        triage_score:    { type: number, nullable: true }
        tenant_id:       { type: string }

    Incident:
      type: object
      properties:
        id:           { type: string, format: uuid }
        title:        { type: string }
        status:       { type: string, enum: [OPEN, INVESTIGATING, CONTAINED, RESOLVED, CLOSED] }
        severity:     { type: integer }
        agent_id:     { type: string, format: uuid }
        assignee:     { type: string, nullable: true }
        mitre_ids:    { type: array, items: { type: string } }
        alert_count:  { type: integer }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at:     { type: string, format: date-time, nullable: true }

    Case:
      type: object
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        status:      { type: string, enum: [open, in_progress, resolved, closed] }
        severity:    { type: integer }
        assignee:    { type: string, nullable: true }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Rule:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        rule_type:   { type: string, enum: [match, threshold, sequence] }
        severity:    { type: integer }
        enabled:     { type: boolean }
        mitre_ids:   { type: array, items: { type: string } }
        conditions:  { type: array, items: { type: object } }
        created_at:  { type: string, format: date-time }

    IOC:
      type: object
      properties:
        id:          { type: string, format: uuid }
        type:        { type: string, enum: [ip, domain, hash, url, email] }
        value:       { type: string }
        severity:    { type: integer }
        source:      { type: string }
        tags:        { type: array, items: { type: string } }
        active:      { type: boolean }
        created_at:  { type: string, format: date-time }

    SLAPolicy:
      type: object
      properties:
        id:                   { type: string, format: uuid }
        name:                 { type: string }
        severity:             { type: integer, nullable: true, description: "If null, applies to all severities" }
        target_mttd_minutes:  { type: integer, nullable: true }
        target_mtta_minutes:  { type: integer, nullable: true }
        target_mttr_hours:    { type: number, nullable: true }
        enabled:              { type: boolean }
        created_at:           { type: string, format: date-time }

    SLABreach:
      type: object
      properties:
        id:           { type: string, format: uuid }
        policy_id:    { type: string, format: uuid }
        policy_name:  { type: string }
        alert_id:     { type: string, format: uuid, nullable: true }
        metric_type:  { type: string, enum: [mtta, mttr, mttd] }
        target_value: { type: number }
        actual_value: { type: number }
        breached_at:  { type: string, format: date-time }

    ForensicsJob:
      type: object
      properties:
        id:          { type: string, format: uuid }
        agent_id:    { type: string, format: uuid }
        job_type:    { type: string, enum: [process_memory, artifacts, disk_image] }
        status:      { type: string, enum: [pending, collecting, ready, failed] }
        params:      { type: object }
        bundle_size: { type: integer, nullable: true, description: "bytes" }
        error_msg:   { type: string, nullable: true }
        created_at:  { type: string, format: date-time }

    Playbook:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        enabled:     { type: boolean }
        trigger:     { type: object, description: "Trigger condition" }
        actions:     { type: array, items: { type: object } }

    YARARule:
      type: object
      properties:
        id:       { type: string, format: uuid }
        name:     { type: string }
        content:  { type: string, description: "Raw YARA rule text" }
        enabled:  { type: boolean }
        tags:     { type: array, items: { type: string } }

    Package:
      type: object
      properties:
        name:     { type: string }
        version:  { type: string }
        arch:     { type: string }
        manager:  { type: string, enum: [dpkg, rpm, unknown] }

    Vulnerability:
      type: object
      properties:
        cve_id:      { type: string, example: "CVE-2024-1234" }
        agent_id:    { type: string, format: uuid }
        package:     { type: string }
        version:     { type: string }
        severity:    { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        cvss_score:  { type: number }
        description: { type: string }

    ThreatActor:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        aliases:     { type: array, items: { type: string } }
        origin:      { type: string }
        motivation:  { type: string }
        description: { type: string }
        mitre_ids:   { type: array, items: { type: string } }

    SOCMetrics:
      type: object
      properties:
        mttd_minutes:     { type: number }
        mtta_minutes:     { type: number }
        mttr_hours:       { type: number }
        mttc_hours:       { type: number }
        open_alert_age_hours: { type: number }
        alert_age_p50h:   { type: number }
        alert_age_p95h:   { type: number }
        resolution_rate:  { type: number }
        fp_rate:          { type: number }
        total_alerts_7d:  { type: integer }
        sla_breaches_7d:  { type: integer }
        breach_rate:      { type: number }
        severity_mttr:    { type: object, additionalProperties: { type: number } }
        status_funnel:    { type: object, additionalProperties: { type: integer } }

paths:
  # ─── AUTH ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and get a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                totp_code: { type: string, description: "Required if TOTP is enabled for this user" }
      responses:
        "200":
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role:  { type: string, enum: [admin, analyst] }
        "401": { description: Invalid credentials }
        "429": { description: Rate limited / account locked }

  /auth/sse-ticket:
    post:
      tags: [Auth]
      summary: Issue a short-lived SSE ticket (used before opening EventSource)
      responses:
        "200":
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }

  /me:
    get:
      tags: [Auth]
      summary: Get current authenticated user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:       { type: string }
                  username: { type: string }
                  role:     { type: string }
                  totp_enabled: { type: boolean }

  /dashboard:
    get:
      tags: [Auth]
      summary: Dashboard summary (alert counts, top agents, recent incidents)
      responses:
        "200": { description: Dashboard data }

  # ─── AGENTS ────────────────────────────────────────────────────────────────

  /agents:
    get:
      tags: [Agents]
      summary: List all agents
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [online, offline, isolated] } }
        - { name: q, in: query, schema: { type: string }, description: "Search by hostname/IP" }
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/Agent' } }

  /agents/top-risk:
    get:
      tags: [Agents]
      summary: List agents ordered by risk score (descending)
      responses:
        "200": { description: Top-risk agents }

  /agents/{id}:
    get:
      tags: [Agents]
      summary: Get a single agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        "404": { description: Not found }
    patch:
      tags: [Agents]
      summary: Update agent metadata (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string }
                tags:     { type: array, items: { type: string } }
      responses:
        "200": { description: Updated agent }

  /agents/{id}/packages:
    get:
      tags: [Agents]
      summary: List installed packages on an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Package list
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages: { type: array, items: { $ref: '#/components/schemas/Package' } }

  /agents/{id}/vulnerabilities:
    get:
      tags: [Agents]
      summary: List CVEs matched to packages on an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Vulnerability list

  /agents/{id}/scan-packages:
    post:
      tags: [Agents]
      summary: Trigger on-demand package scan on agent (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Scan triggered }

  /agents/{id}/audit:
    get:
      tags: [Agents]
      summary: Audit log of actions taken on this agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Audit entries }

  /agents/{id}/attack-surface:
    get:
      tags: [Agents]
      summary: Attack surface snapshot for a specific agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Attack surface data }

  /agents/{id}/forensic-timeline:
    get:
      tags: [Agents]
      summary: Forensic event timeline for an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Timeline events }

  /agents/{id}/fleet-config:
    get:
      tags: [Agents]
      summary: Get current fleet configuration for an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Fleet config }
    put:
      tags: [Agents]
      summary: Push fleet config to an agent (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Monitor enable/disable map and config overrides
      responses:
        "200": { description: Config applied }

  /agents/{id}/fleet-config/history:
    get:
      tags: [Agents]
      summary: Fleet config change history for an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Config history }

  /agents/{id}/fleet-config/rollback/{sid}:
    post:
      tags: [Agents]
      summary: Roll back to a previous fleet config snapshot (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Rollback applied }

  /agents/{id}/winevent-config:
    get:
      tags: [Agents]
      summary: Get Windows Event Log channel config for an agent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: WinEvent config }
    patch:
      tags: [Agents]
      summary: Update Windows Event Log channel config (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }

  /agents/{id}/tamper-alert:
    post:
      tags: [Agents]
      summary: Agent-reported tamper alert (called by agent, not analyst)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Recorded }

  # ─── EVENTS ────────────────────────────────────────────────────────────────

  /events:
    get:
      tags: [Events]
      summary: List events with filters
      parameters:
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  total:  { type: integer }

  /events/{id}:
    get:
      tags: [Events]
      summary: Get a single event by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }

  /events/stream:
    get:
      tags: [Events]
      summary: Server-sent event stream of live events
      description: |
        Returns a `text/event-stream`. Authenticate via `?ticket=<sse-ticket>` (from `POST /auth/sse-ticket`).
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
      responses:
        "200": { description: SSE stream }

  /events/inject:
    post:
      tags: [Events]
      summary: Inject a synthetic event (admin, testing)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        "201": { description: Event injected }

  /events/{id}/chain:
    get:
      tags: [Events]
      summary: Get the attack chain an event belongs to
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Chain record }

  /processes/{pid}/tree:
    get:
      tags: [Events]
      summary: Get process tree rooted at a PID
      parameters:
        - { name: pid, in: path, required: true, schema: { type: integer } }
        - { name: agent_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Process tree }

  # ─── ALERTS ────────────────────────────────────────────────────────────────

  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: integer } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: rule_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }
                  total:  { type: integer }

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get a single alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
    patch:
      tags: [Alerts]
      summary: Update alert status or assignment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:   { type: string, enum: [open, acknowledged, resolved, false_positive] }
                assignee: { type: string }
                notes:    { type: string }
      responses:
        "200": { description: Updated alert }

  /alerts/{id}/events:
    get:
      tags: [Alerts]
      summary: List events that triggered this alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Events }

  /alerts/{id}/timeline:
    get:
      tags: [Alerts]
      summary: Chronological event timeline for an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Timeline }

  /alerts/{id}/explain:
    post:
      tags: [Alerts]
      summary: AI explanation of why this alert fired
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: AI explanation
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation: { type: string }

  /alerts/{id}/triage:
    post:
      tags: [Alerts]
      summary: AI-powered triage verdict (true positive / false positive / suspicious)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Triage result
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string }
                  score:   { type: number }
                  notes:   { type: string }

  /alerts/{id}/summarise:
    post:
      tags: [Alerts]
      summary: Generate AI narrative summary of an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Summary text }

  /alerts/{id}/chat:
    post:
      tags: [Alerts]
      summary: Conversational AI Q&A about an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200": { description: AI response }

  /alerts/{id}/enrichments:
    get:
      tags: [Alerts]
