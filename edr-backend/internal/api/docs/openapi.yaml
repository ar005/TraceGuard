      tags: [Suppressions]
      summary: Create a suppression (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string }
                rule_id:    { type: string }
                conditions: { type: array, items: { type: object } }
