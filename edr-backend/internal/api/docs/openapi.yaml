  /alerts/{id}/enrich:
    post:
      tags: [Alerts]
      summary: Trigger on-demand enrichment for an alert (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Enrichment triggered }

  # ─── INCIDENTS ─────────────────────────────────────────────────────────────

  /incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: integer } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents: { type: array, items: { $ref: '#/components/schemas/Incident' } }
                  total:     { type: integer }

  /incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get a single incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
    patch:
      tags: [Incidents]
      summary: Update incident status, assignee, or notes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:   { type: string, enum: [OPEN, INVESTIGATING, CONTAINED, RESOLVED, CLOSED] }
                assignee: { type: string }
                notes:    { type: string }
      responses:
        "200": { description: Updated incident }

  /incidents/{id}/alerts:
    get:
      tags: [Incidents]
      summary: List alerts grouped into this incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Alert list }

  /incidents/{id}/graph:
    get:
      tags: [Incidents]
      summary: Entity relationship graph for an incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Graph nodes/edges }

  /incidents/{id}/timeline:
    get:
      tags: [Incidents]
      summary: Chronological event timeline for an incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Timeline events }

  /incidents/{id}/attack-graph:
    get:
      tags: [Incidents]
      summary: MITRE ATT&CK-mapped attack graph for an incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Attack graph }

  /incidents/{id}/forensic-timeline:
    get:
      tags: [Incidents]
      summary: Forensic artifact timeline associated with an incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Forensic timeline }

  /incidents/{id}/summarise:
    post:
      tags: [Incidents]
      summary: Generate AI narrative summary of an incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Summary }

  /incidents/{id}/chat:
    post:
      tags: [Incidents]
      summary: Conversational AI Q&A about an incident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200": { description: AI response }

  # ─── CASES ─────────────────────────────────────────────────────────────────

  /cases:
    get:
      tags: [Cases]
      summary: List investigation cases
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases: { type: array, items: { $ref: '#/components/schemas/Case' } }
    post:
      tags: [Cases]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:       { type: string }
                description: { type: string }
                severity:    { type: integer }
                assignee:    { type: string }
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }

  /cases/{id}:
    get:
      tags: [Cases]
      summary: Get a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
    put:
      tags: [Cases]
      summary: Update a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:    { type: string }
                status:   { type: string }
                assignee: { type: string }
                notes:    { type: string }
      responses:
        "200": { description: Updated case }
    delete:
      tags: [Cases]
      summary: Delete a case (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /cases/{id}/alerts:
    get:
      tags: [Cases]
      summary: List alerts linked to a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Alert list }
    post:
      tags: [Cases]
      summary: Link an alert to a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [alert_id]
              properties:
                alert_id: { type: string, format: uuid }
      responses:
        "200": { description: Linked }

  /cases/{id}/alerts/{alert_id}:
    delete:
      tags: [Cases]
      summary: Unlink an alert from a case (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: alert_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Unlinked }

  /cases/{id}/notes:
    get:
      tags: [Cases]
      summary: List notes on a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Notes }
    post:
      tags: [Cases]
      summary: Add a note to a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201": { description: Created note }

  /cases/{id}/notes/{note_id}:
    put:
      tags: [Cases]
      summary: Update a case note
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: note_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
      responses:
        "200": { description: Updated note }
    delete:
      tags: [Cases]
      summary: Delete a case note (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: note_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /cases/{id}/summarise:
    post:
      tags: [Cases]
      summary: Generate AI summary of a case
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Summary }

  # ─── RULES ─────────────────────────────────────────────────────────────────

  /rules:
    get:
      tags: [Rules]
      summary: List detection rules
      parameters:
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: rule_type, in: query, schema: { type: string } }
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: { type: array, items: { $ref: '#/components/schemas/Rule' } }
    post:
      tags: [Rules]
      summary: Create a detection rule (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rule' }
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }

  /rules/{id}:
    get:
      tags: [Rules]
      summary: Get a rule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
    put:
      tags: [Rules]
      summary: Update a rule (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rule' }
      responses:
        "200": { description: Updated }
    delete:
      tags: [Rules]
      summary: Delete a rule (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /rules/reload:
    post:
      tags: [Rules]
      summary: Hot-reload detection engine rules from DB (admin)
      responses:
        "200": { description: Reloaded }

  /rules/{id}/backtest:
    post:
      tags: [Rules]
      summary: Backtest a rule against historical events (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
