        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Connectivity result }

  # ─── HUNT ──────────────────────────────────────────────────────────────────

  /hunt:
    post:
      tags: [Hunt]
      summary: Execute a threat hunting query
      description: |
        Runs a SQL-like query against the events table. Blocked keywords: `DROP`, `DELETE`, `UPDATE`, `INSERT`, `CREATE`, `ALTER`, `TRUNCATE`, `EXEC`, `EXECUTE`. Max 10,000 results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:     { type: string, description: "SQL SELECT statement against events" }
                save_as:   { type: string, description: "Optional name to save this query" }
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object } }
                  count:   { type: integer }
                  elapsed_ms: { type: integer }
        "400": { description: Invalid or blocked query }

  /hunt/generate:
    post:
      tags: [Hunt]
      summary: Generate a hunt query from a natural language prompt (AI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string, description: "Natural language description of what to hunt for" }
      responses:
        "200":
          description: Generated SQL query
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:       { type: string }
                  explanation: { type: string }

