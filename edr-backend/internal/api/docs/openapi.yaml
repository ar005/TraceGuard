      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id]
              properties:
                campaign_id: { type: string }
      responses:
        "200": { description: Linked }

  # ─── IOC FEEDS ─────────────────────────────────────────────────────────────

  /ioc-feeds:
    get:
      tags: [IOC Feeds]
      summary: List custom IOC feed sources
      responses:
        "200": { description: Feed list }

  /ioc-feeds/{id}:
    put:
      tags: [IOC Feeds]
      summary: Create or update a custom IOC feed (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, url, format]
              properties:
                name:            { type: string }
                url:             { type: string, format: uri }
                format:          { type: string, enum: [csv, json, txt, stix] }
                enabled:         { type: boolean }
                sync_interval_h: { type: integer }
      responses:
        "200": { description: Saved }
    delete:
      tags: [IOC Feeds]
      summary: Delete a custom IOC feed (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /ioc-feeds/{id}/sync:
    post:
      tags: [IOC Feeds]
      summary: Trigger manual sync of a custom feed (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Sync started }

  /ioc-feeds/{id}/log:
    get:
      tags: [IOC Feeds]
      summary: Get sync log for a custom feed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
