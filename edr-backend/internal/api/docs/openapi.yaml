      responses:
        "200": { description: Deleted }

  # ─── IOCs ──────────────────────────────────────────────────────────────────

  /iocs:
    get:
      tags: [IOCs]
      summary: List IOCs
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: IOC list
          content:
            application/json:
              schema:
                type: object
                properties:
                  iocs:  { type: array, items: { $ref: '#/components/schemas/IOC' } }
                  total: { type: integer }
    post:
      tags: [IOCs]
      summary: Create an IOC (admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IOC' }
      responses:
        "201": { description: Created IOC }

  /iocs/stats:
    get:
      tags: [IOCs]
      summary: IOC count statistics by type and source
      responses:
        "200": { description: Stats }

  /iocs/sources:
    get:
      tags: [IOCs]
      summary: List IOC source statistics
      responses:
        "200": { description: Source stats }

  /iocs/feeds:
    get:
      tags: [IOCs]
      summary: List built-in IOC feed sources
      responses:
        "200": { description: Feed list }

  /iocs/feeds/sync:
    post:
      tags: [IOCs]
      summary: Trigger sync of all enabled IOC feeds (admin)
      responses:
        "200": { description: Sync triggered }

  /iocs/bulk:
    post:
      tags: [IOCs]
      summary: Bulk import IOCs (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [iocs]
              properties:
                iocs:   { type: array, items: { $ref: '#/components/schemas/IOC' } }
                source: { type: string }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  skipped:  { type: integer }

  /iocs/bulk-retire:
    post:
      tags: [IOCs]
      summary: Bulk retire (deactivate) IOCs by source (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                ids:    { type: array, items: { type: string } }
      responses:
        "200": { description: Retired }

  /iocs/{id}:
    get:
      tags: [IOCs]
      summary: Get a single IOC
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: IOC
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IOC' }
    delete:
      tags: [IOCs]
      summary: Delete an IOC (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /iocs/source/{source}:
    delete:
      tags: [IOCs]
      summary: Delete all IOCs from a source (admin)
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }

  /iocs/{id}/enrich:
    post:
      tags: [IOCs]
      summary: Trigger enrichment for an IOC (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Enriched }

  /iocs/{id}/actor:
    post:
      tags: [IOCs]
      summary: Link an IOC to a threat actor (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [actor_id]
              properties:
                actor_id: { type: string }
